name: ci

# Runs on every pull request and every push to main.
# No AWS credentials needed: these checks never touch your account.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the job token can only read the repo.
permissions:
  contents: read

jobs:
  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive -diff infra/

      # infra/ — VPC + EKS (phase 1)
      - name: Init infra (no backend)
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Validate infra
        run: terraform -chdir=infra validate

      # infra/global/ — ECR + OIDC (phase 2)
      - name: Init infra/global (no backend)
        run: terraform -chdir=infra/global init -backend=false -input=false

      - name: Validate infra/global
        run: terraform -chdir=infra/global validate



  helm:
    name: helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Lint
        run: |
          helm lint charts/demo
          helm lint charts/python-demo

      - name: Render templates
        run: |
          helm template demo charts/demo > /dev/null
          helm template python-demo charts/python-demo > /dev/null

  python:
    name: python test + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest tests/ -v

  trivy:
    name: trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image for scanning
        run: docker build -t python-demo:ci app/

      - name: Scan image
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: python-demo:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
