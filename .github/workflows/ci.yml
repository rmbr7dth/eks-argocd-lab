name: ci

# Runs on every pull request and every push to main.
# No AWS credentials needed: these checks never touch your account.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the job token can only read the repo.
permissions:
  contents: read

jobs:
  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive -diff

      # -backend=false: download providers/modules only, never touch S3 state.
      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  helm:
    name: helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Lint
        run: |
          helm lint charts/demo
          helm lint charts/python-demo

      - name: Render templates
        run: |
          helm template demo charts/demo > /dev/null
          helm template python-demo charts/python-demo > /dev/null

  python:
    name: python test + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest tests/ -v
