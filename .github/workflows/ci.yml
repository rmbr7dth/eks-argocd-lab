name: ci

# Runs on every pull request and every push to main.
# No AWS credentials needed: these checks never touch your account.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the job token can only read the repo.
permissions:
  contents: read

jobs:
  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive -diff

      # -backend=false: download providers/modules only, never touch S3 state.
      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  helm:
    name: helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0 # ← replace with YOUR `helm version --short` (no +g… part)

      - name: Lint
        run: helm lint charts/demo

      - name: Render templates
        run: helm template demo charts/demo > /dev/null
