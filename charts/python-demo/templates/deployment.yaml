apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-demo
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: python-demo
  template:
    metadata:
      labels:
        app: python-demo
    spec:
      containers:
        - name: web
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 8000
          env:
            - name: UI_COLOR
              value: {{ .Values.ui.color | quote }}
            - name: UI_MESSAGE
              value: {{ .Values.ui.message | quote }}
            - name: APP_VERSION
              value: {{ .Values.appVersion | quote }}
          resources:
            requests:
              cpu: {{ .Values.resources.cpu }}
              memory: {{ .Values.resources.memory }}
            limits:
              memory: {{ .Values.resources.memoryLimit }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
